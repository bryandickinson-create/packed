<style>
  :root{
    --ink:#121824; --panel:#1B2331; --panel-2:#222C3D; --line:#2E3A4E;
    --text:#E8EEF7; --muted:#8B9BB4;
    --red:#F2564B; --amber:#F6A821; --green:#3FCF6E;
    --kid-a:#4EA8FF; --kid-b:#FF8C42; --accent:var(--kid-a);
    --display:"Barlow Condensed","Oswald","Arial Narrow",system-ui,sans-serif;
    --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;
    line-height:1.45;min-height:100vh;display:flex;justify-content:center;
    padding:calc(14px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-right, 0px))
            calc(90px + env(safe-area-inset-bottom, 0px)) calc(12px + env(safe-area-inset-left, 0px))}
  .app{width:100%;max-width:540px}

  .mast{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:6px}
  .word{font-family:var(--display);font-weight:700;font-size:38px;line-height:.9;
    letter-spacing:.02em;text-transform:uppercase;margin:0}
  .word span{color:var(--accent);transition:color .3s}
  .word small{display:block;font-family:var(--body);font-weight:500;font-size:11px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .ghost{font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid var(--line);
    border-radius:99px;padding:8px 13px;cursor:pointer;transition:border-color .2s,color .2s;white-space:nowrap}
  .ghost:hover{border-color:var(--muted);color:var(--text)}
  .ghost.on{border-color:var(--accent);color:var(--accent)}

  .sync{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;font-weight:600;color:var(--muted);margin-bottom:14px}
  .sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
  .sync.ok i{background:var(--green)}
  .sync.busy i{background:var(--amber);animation:blink 1s infinite}
  .sync.off i{background:var(--red)}
  @keyframes blink{50%{opacity:.25}}
  .sync .ic{margin-left:auto;padding:8px 10px;font-size:14px;line-height:1}
  .sync #switchCode{margin-left:6px}

  .kids{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .kid{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:11px 13px;cursor:pointer;text-align:left;color:var(--muted);font-family:var(--body);
    overflow:hidden;transition:border-color .2s,color .2s}
  .kid:hover{border-color:var(--muted)}
  .kid .nm{display:block;font-family:var(--display);font-weight:700;font-size:22px;
    text-transform:uppercase;letter-spacing:.03em;line-height:1;margin-bottom:5px}
  .kid .ct{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
  .kid[aria-selected="true"]{color:var(--text);border-color:transparent;background:var(--panel-2)}
  .kid[aria-selected="true"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tint)}
  .kid input{width:100%;background:#131A26;border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:5px 8px;font-family:var(--display);font-size:20px;font-weight:700;
    text-transform:uppercase;letter-spacing:.03em}
  .kid input:focus{outline:2px solid var(--accent);outline-offset:1px}

  .daybar{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:14px 15px 15px;margin-bottom:14px}
  .daynav{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .arrow{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:9px;

  .arrow:hover{border-color:var(--muted);color:var(--text)}
  .daytxt{text-align:center;flex:1;min-width:0}
  .dow{font-family:var(--display);font-weight:700;font-size:27px;line-height:1;
    text-transform:uppercase;letter-spacing:.04em}
  .dnum{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:4px}
  .cue{margin-top:13px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;
    color:var(--muted);display:flex;align-items:baseline;gap:8px}
  .cue b{font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;color:var(--accent);flex:none}
  .meter{display:flex;height:7px;border-radius:99px;overflow:hidden;background:#131A26;margin-top:12px;gap:2px}
  .meter i{display:block;flex:0 0 auto;min-width:0;transition:width .35s cubic-bezier(.2,.8,.3,1);border-radius:99px}
  .m-amber{background:var(--amber)}
  .m-green{background:var(--green)}
  .tally{display:flex;justify-content:space-between;margin-top:8px;font-size:11.5px;
    letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted)}
  .tally .done{color:var(--green)}

  .list{display:flex;flex-direction:column;gap:8px}
  .row{position:relative;display:flex;align-items:center;gap:13px;width:100%;background:var(--panel);
    border:1px solid var(--line);border-left:5px solid var(--red);border-radius:var(--r);
    padding:13px 14px;cursor:pointer;text-align:left;color:var(--text);font-family:var(--body);
    font-size:16px;overflow:hidden;transition:border-color .25s,background .25s}
  .row:hover{background:var(--panel-2)}
  .row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .row .mark{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--red);
    display:grid;place-items:center;font-size:15px;font-weight:700;color:#121824;
    transition:background .25s,border-color .25s,transform .25s}
  .row .nm{flex:1;min-width:0;font-weight:500}
  .row .nm b{display:block;font-weight:600;overflow-wrap:anywhere}
  .row .when{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);font-weight:600;margin-top:3px}
  .row .state{flex:none;font-family:var(--display);font-size:14px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;color:var(--red);transition:color .25s}
  .row.s1{border-left-color:var(--amber)}
  .row.s1 .mark{border-color:var(--amber);background:var(--amber)}
  .row.s1 .state{color:var(--amber)}
  .row.s2{border-left-color:var(--green)}
  .row.s2 .mark{border-color:var(--green);background:var(--green)}
  .row.s2 .state{color:var(--green)}
  .row.s2 .nm b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
  .row.pop .mark{transform:scale(1.22)}
  .row .sweep{position:absolute;inset:0;background:currentColor;opacity:0;pointer-events:none}
  .row.pop .sweep{animation:sweep .45s ease-out}
  @keyframes sweep{0%{opacity:.16}100%{opacity:0}}
  .kill{flex:none;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);
    background:transparent;color:var(--muted);font-size:16px;cursor:pointer;line-height:1}
  .kill:hover{border-color:var(--red);color:var(--red)}

  .empty{border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted)}
  .empty b{display:block;font-family:var(--display);font-size:20px;letter-spacing:.04em;
    text-transform:uppercase;color:var(--text);margin-bottom:5px}

  .add{width:100%;margin-top:10px;background:transparent;border:1px dashed var(--line);
    color:var(--muted);border-radius:var(--r);padding:14px;cursor:pointer;font-family:var(--display);
    font-size:17px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    transition:border-color .2s,color .2s}
  .add:hover{border-color:var(--accent);color:var(--accent)}
  .form{background:var(--panel);border:1px solid var(--accent);border-radius:var(--r);
    padding:15px;margin-top:10px;display:none}
  .form.open{display:block}
  .lab{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:7px}
  .ti{width:100%;background:#131A26;border:1px solid var(--line);color:var(--text);border-radius:10px;
    padding:12px 13px;font-family:var(--body);font-size:16px}
  .ti:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .seg{display:flex;gap:6px;margin:14px 0 0;flex-wrap:wrap}
  .chip{background:#131A26;border:1px solid var(--line);color:var(--muted);border-radius:99px;
    padding:8px 13px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    cursor:pointer;font-family:var(--body);transition:border-color .2s,color .2s,background .2s}
  .chip:hover{border-color:var(--muted)}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#101622}
  .days{display:none;gap:5px;margin-top:12px}
  .days.open{display:flex}
  .days .chip{flex:1;padding:9px 0;text-align:center;border-radius:9px}
  .actions{display:flex;gap:8px;margin-top:16px}
  .btn{flex:1;border-radius:10px;padding:13px;cursor:pointer;font-family:var(--display);font-size:16px;
    font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);
    background:transparent;color:var(--muted)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#101622}
  .btn:hover{filter:brightness(1.08)}
  .tools{margin-top:14px;display:none;gap:8px;flex-wrap:wrap}
  .tools.open{display:flex}
  .note{margin-top:20px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}

  /* ---------- view tabs (Today / Schedule) ---------- */
  .vtabs{display:flex;gap:6px;margin-bottom:14px}
  .vtab{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:10px;
    padding:10px;font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;cursor:pointer;transition:border-color .2s,color .2s,background .2s}
  .vtab:hover{border-color:var(--muted);color:var(--text)}
  .vtab.on{background:var(--accent);border-color:var(--accent);color:#101622}

  /* ---------- schedule editor ---------- */
  .schedhead{margin:2px 0 12px;display:flex;flex-direction:column;gap:3px}
  .schedhead b{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
  .schedhead span{font-size:12.5px;color:var(--muted)}
  .scard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px}
  .scard-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .snm{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
  .swhen{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;flex:none}
  .drow{display:flex;gap:5px}
  .dtog{flex:1;padding:9px 0;text-align:center;border-radius:9px;background:#131A26;border:1px solid var(--line);
    color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;
    transition:border-color .2s,color .2s,background .2s}
  .dtog:hover{border-color:var(--muted)}
  .dtog.on{background:var(--accent);border-color:var(--accent);color:#101622}

  .gate{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px 20px;margin-top:8px}
  .gate h2{font-family:var(--display);font-size:26px;font-weight:700;text-transform:uppercase;
    letter-spacing:.03em;margin:0 0 10px}
  .gate p{color:var(--muted);font-size:14px;margin:0 0 16px}
  .gate ol{color:var(--muted);font-size:14px;padding-left:20px;margin:0 0 16px;line-height:1.75}
  .gate code{background:#131A26;border:1px solid var(--line);border-radius:5px;padding:1px 6px;
    font-size:12.5px;color:var(--text)}
  .loading{text-align:center;padding:60px 0;color:var(--muted);font-family:var(--display);
    letter-spacing:.14em;text-transform:uppercase}
  /* ---------- iPad two-up layout ---------- */
  .col{min-width:0}
  .colhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    padding:0 2px 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .colnm{font-family:var(--display);font-weight:700;font-size:24px;line-height:1;
    text-transform:uppercase;letter-spacing:.03em;color:var(--accent)}
  .colct{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted);flex:none}
  .colhead input{flex:1;min-width:0;background:#131A26;border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:5px 9px;font-family:var(--display);font-size:20px;font-weight:700;
    text-transform:uppercase;letter-spacing:.03em}
  .colhead input:focus{outline:2px solid var(--accent);outline-offset:1px}
  @media (min-width:900px){
    .app{max-width:1040px}
    .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  }

  /* ---------- celebration ---------- */
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
  .confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;opacity:.95;
    animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(104vh) rotate(540deg);opacity:.85}}

  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>

<div class="app" id="app"><div class="loading">Opening the bag…</div></div>

<script>
(function(){
  "use strict";

  /* ============================================================
     PASTE YOUR TWO SUPABASE VALUES HERE
     ============================================================ */
  var CONFIG = {
    url: "https://gnzjuwakapuhwekwsxjl.supabase.co",
    key: "sb_publishable_NmotU4hE9oR4fG35Owimxg_Vp4Z5NGd"
  };
  /* ============================================================ */

  var CACHE = "packed:cache", CODEKEY = "packed:code";
  var NAMES = ["Atticus","Linus"];
  var DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var DOW3 = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var DOW1 = ["S","M","T","W","T","F","S"];
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  var state = null, code = null, kid = 0, view = new Date(), edit = false;
  var viewMode = "today", schedDraft = {}, formKid = 0;
  var formOpen = false, draft = {type:"daily", days:[]};
  var dirty = false, netOk = true, busy = false, lastSync = 0, clock = 0, timer = null;
  var app = document.getElementById("app");

  /* ---------- helpers ---------- */
  function now(){ clock = Math.max(Date.now(), clock + 1); return clock; }
  function uid(){ return Math.random().toString(36).slice(2,9); }
  function key(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function shift(d,n){ var x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
  function startOfToday(){ var t=new Date(); t.setHours(0,0,0,0); return t; }
  function isEvening(){ return new Date().getHours() >= 16; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function local(k,v){
    try{ if(v === undefined) return window.localStorage.getItem(k); window.localStorage.setItem(k,v); }
    catch(e){ return null; }
  }

  /* ---------- state ---------- */
  function blank(){
    return { kids:[{id:"a",name:NAMES[0],t:0},{id:"b",name:NAMES[1],t:0}], items:{}, status:{} };
  }
  function seed(){
    var s = blank(), t = now();
    function put(k,n,ty,ds){ var id=uid(); s.items[id]={id:id,kid:k,name:n,type:ty,days:ds||[],t:t}; }
    ["a","b"].forEach(function(k){
      put(k,"Water bottle","daily"); put(k,"Lunch","daily");
      put(k,"Homework folder","weekly",[1,2,3,4,5]);
    });
    put("a","Tennis racquet","weekly",[1]);
    put("b","Soccer cleats","weekly",[2,4]);
    return s;
  }
  /* Last edit wins, field by field, so two phones tapping at once don't
     wipe each other out — only the specific thing each one touched moves. */
  function merge(a,b){
    var out = { kids:[], items:{}, status:{} };
    for(var i=0;i<2;i++){
      var ka = (a.kids&&a.kids[i]) || {id:i?"b":"a",name:NAMES[i]||("Kid "+(i+1)),t:0};
      var kb = (b.kids&&b.kids[i]) || ka;
      out.kids.push((kb.t||0) > (ka.t||0) ? kb : ka);
    }
    [a.items,b.items].forEach(function(src){
      Object.keys(src||{}).forEach(function(id){
        var cur = out.items[id], nx = src[id];
        if(!cur || (nx.t||0) > (cur.t||0)) out.items[id] = nx;
      });
    });
    [a.status,b.status].forEach(function(src){
      Object.keys(src||{}).forEach(function(dk){
        out.status[dk] = out.status[dk] || {};
        Object.keys(src[dk]||{}).forEach(function(id){
          var cur = out.status[dk][id], nx = src[dk][id];
          if(!cur || (nx.t||0) > (cur.t||0)) out.status[dk][id] = nx;
        });
      });
    });
    return out;
  }
  function tidy(){
    var floor = key(shift(startOfToday(),-14)), today = key(startOfToday());
    Object.keys(state.status).forEach(function(k){ if(k < floor) delete state.status[k]; });
    var old = now() - 1000*60*60*24*30;
    Object.keys(state.items).forEach(function(id){
      var it = state.items[id];
      if(it.del && (it.t||0) < old) delete state.items[id];
      else if(!it.del && it.type === "once" && it.date < today) delete state.items[id];
    });
  }

  /* ---------- network ---------- */
  function configured(){ return !!(CONFIG.url && CONFIG.key); }
  function headers(extra){
    var h = { "apikey":CONFIG.key, "Authorization":"Bearer "+CONFIG.key, "Content-Type":"application/json" };
    for(var k in (extra||{})) h[k] = extra[k];
    return h;
  }
  async function pull(){
    var r = await fetch(CONFIG.url+"/rest/v1/lists?code=eq."+encodeURIComponent(code)+"&select=data",
      { headers:headers() });
    if(!r.ok) throw new Error("read failed: "+r.status);
    var rows = await r.json();
    return rows.length ? rows[0].data : null;
  }
  async function push(data){
    var r = await fetch(CONFIG.url+"/rest/v1/lists?on_conflict=code",
      { method:"POST",
        headers:headers({ "Prefer":"resolution=merge-duplicates,return=minimal" }),
        body:JSON.stringify({ code:code, data:data, updated_at:new Date().toISOString() }) });
    if(!r.ok) throw new Error("write failed: "+r.status);
  }
  async function sync(force){
    if(!configured() || !code || busy) return;
    busy = true; paintSync();
    try{
      var remote = await pull();
      if(remote && remote.kids) state = merge(state, remote);
      local(CACHE, JSON.stringify(state));
      if(dirty || !remote || force){ await push(state); dirty = false; }
      netOk = true; lastSync = Date.now();
    }catch(e){
      netOk = false;
      console.error(e);
    }
    busy = false;
    render();
  }
  var nudge = null;
  function touched(){
    dirty = true;
    local(CACHE, JSON.stringify(state));
    clearTimeout(nudge);
    nudge = setTimeout(function(){ sync(); }, 500);
  }

  /* ---------- rules ---------- */
  function live(){
    return Object.keys(state.items).map(function(id){ return state.items[id]; })
      .filter(function(it){ return !it.del; });
  }
  function due(it,d){
    if(it.type === "daily") return true;
    if(it.type === "weekly") return it.days.indexOf(d.getDay()) !== -1;
    return it.date === key(d);
  }
  function forDay(kidId,d){
    return live().filter(function(it){ return it.kid === kidId && due(it,d); })
      .sort(function(a,b){ return a.name.localeCompare(b.name); });
  }
  function stat(dk,id){ var e = state.status[dk] && state.status[dk][id]; return e ? (e.v||0) : 0; }
  function setStat(dk,id,v){
    if(!state.status[dk]) state.status[dk] = {};
    state.status[dk][id] = { v:v, t:now() };
    touched();
  }
  function when(it){
    if(it.type === "daily") return "Every day";
    if(it.type === "once") return "Just today";
    if(it.days.length === 7) return "Every day";
    if(it.days.length === 5 && [1,2,3,4,5].every(function(n){return it.days.indexOf(n)!==-1;})) return "School days";
    return it.days.slice().sort().map(function(n){ return DOW3[n]; }).join(" · ") || "No days set";
  }
  function counts(kidId,d){
    var dk = key(d), list = forDay(kidId,d), p = 0, c = 0;
    list.forEach(function(it){ var s = stat(dk,it.id); if(s===1) p++; if(s===2) c++; });
    return { total:list.length, packed:p, confirmed:c };
  }

  /* ---------- schedule editing ---------- */
  /* A "daily" item is every weekday; a "weekly" item carries its own day list.
     The schedule editor speaks purely in weekday sets and converts back:
     all 7 days -> daily, any subset -> weekly, and never fewer than one day. */
  function itemDays(it){ return it.type === "daily" ? [0,1,2,3,4,5,6] : (it.days||[]).slice(); }
  function setItemDays(id, days){
    var it = state.items[id]; if(!it) return;
    days = days.slice().sort(function(a,b){ return a-b; });
    var type = days.length === 7 ? "daily" : "weekly";
    state.items[id] = { id:it.id, kid:it.kid, name:it.name, type:type,
      days: type === "daily" ? [] : days, date:it.date, t:now() };
    touched();
  }
  function toggleItemDay(id, d){
    var days = itemDays(state.items[id]), i = days.indexOf(d);
    if(i === -1) days.push(d);
    else { if(days.length <= 1) return; days.splice(i,1); }   // keep at least one day
    setItemDays(id, days);
  }
  function schedItems(kidId){
    return live().filter(function(it){ return it.kid === kidId && it.type !== "once"; })
      .sort(function(a,b){ return a.name.localeCompare(b.name); });
  }

  /* ---------- sound ---------- */
  var actx = null, soundOn = local("packed:sound") !== "off";
  function audioCtx(){
    if(!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = null; } }
    if(actx && actx.state === "suspended"){ try{ actx.resume(); }catch(e){} }
    return actx;
  }
  var SND = {
    pack:   [{f:523,d:0.10,type:"triangle"}],
    got:    [{f:659,d:0.09,type:"triangle"},{f:988,d:0.13,at:0.075,type:"triangle"}],
    reset:  [{f:300,d:0.09,type:"sine",v:0.09}],
    kidDone:[{f:523,d:0.12,type:"triangle"},{f:659,d:0.12,at:0.10,type:"triangle"},{f:784,d:0.20,at:0.20,type:"triangle"}],
    allDone:[{f:523,d:0.13,type:"triangle"},{f:659,d:0.13,at:0.11,type:"triangle"},{f:784,d:0.13,at:0.22,type:"triangle"},{f:1047,d:0.32,at:0.33,type:"triangle",v:0.17},{f:1319,d:0.30,at:0.42,type:"sine",v:0.11}]
  };
  function play(name){
    if(!soundOn) return;
    var ctx = audioCtx(); if(!ctx) return;
    var t0 = ctx.currentTime;
    (SND[name] || []).forEach(function(n){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = n.type || "sine"; o.frequency.value = n.f;
      var s = t0 + (n.at || 0), dur = n.d || 0.12, vol = n.v || 0.14;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(vol, s + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(s); o.stop(s + dur + 0.03);
    });
  }
  function celebrate(){
    try{
      if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var wrap = document.createElement("div"); wrap.className = "confetti";
      var cols = ["#4EA8FF","#FF8C42","#3FCF6E","#F6A821","#FFFFFF"];
      for(var i=0;i<32;i++){
        var p = document.createElement("i");
        p.style.left = (Math.random()*100) + "vw";
        p.style.background = cols[i % cols.length];
        p.style.animationDelay = (Math.random()*0.25) + "s";
        p.style.animationDuration = (0.9 + Math.random()*0.8) + "s";
        wrap.appendChild(p);
      }
      document.body.appendChild(wrap);
      setTimeout(function(){ if(wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 2200);
    }catch(e){}
  }

  /* ---------- responsive ---------- */
  var WIDE = window.matchMedia ? window.matchMedia("(min-width: 900px)") : { matches:false };

  else if(WIDE.addListener) WIDE.addListener(function(){ if(state && code) render(); });

  /* ---------- tiny helpers ---------- */
  function q(sel){ return app.querySelectorAll(sel); }

  function tint(ki){ return ki === 0 ? "var(--kid-a)" : "var(--kid-b)"; }
  function dowLabel(dk){
    var todayK = key(startOfToday()), tomorrowK = key(shift(startOfToday(),1));
    return dk===todayK ? " &middot; Today" : dk===tomorrowK ? " &middot; Tomorrow" : "";
  }
  function timeCue(dk){
    var todayK = key(startOfToday()), tomorrowK = key(shift(startOfToday(),1));
    var m = dk===tomorrowK && isEvening() ? "night"
          : dk===todayK && !isEvening() ? "morning"
          : dk===todayK ? "night-today" : "other";
    return m==="night" ? ["Tonight","Get everything in the bag, then tap once. Amber means packed."]
         : m==="morning" ? ["This morning","Tap each thing again as you grab it. Green means it's with you."]
         : m==="night-today" ? ["Today","Tap once when it's packed, twice when you've got it."]
         : ["Ahead","Planning ahead. Tap once when it's packed, twice when you've got it."];
  }
  function dayComplete(kidId, d){ var c = counts(kidId, d); return c.total>0 && c.confirmed===c.total; }
  function allComplete(d){
    var any=false, ok=true;
    state.kids.forEach(function(p){ var c=counts(p.id,d); if(c.total>0){ any=true; if(c.confirmed!==c.total) ok=false; } });
    return any && ok;
  }

  function cueHTML(kidId, shared){

    return '<div class="meter"><i class="m-green" style="width:' + pctG + '%"></i><i class="m-amber" style="width:' + pctA + '%"></i></div>'
      + '<div class="tally"><span>' + c.packed + ' packed</span><span class="done">' + c.confirmed + ' of ' + c.total + ' confirmed</span></div>';
  }
  function rowHTML(it, dk){
    var s = stat(dk,it.id);

  /* ---------- tap (with sound + celebration) ---------- */
  function tap(row){
    if(edit) return;
    var dk = key(view), id = row.dataset.id, it = state.items[id];
    if(!it) return;
    var wasAll = allComplete(view), wasKid = dayComplete(it.kid, view);
    var s = (stat(dk,id) + 1) % 3;
    setStat(dk,id,s);
    play(s===1 ? "pack" : s===2 ? "got" : "reset");
    try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){}
    row.className = "row s" + s + " pop";
    row.querySelector(".mark").innerHTML = s===0 ? "" : s===1 ? "&#9679;" : "&#10003;";
    var st = row.querySelector(".state");
    if(st) st.textContent = s===0 ? "Not yet" : s===1 ? "Packed" : "Got it";
    if(allComplete(view) && !wasAll){ setTimeout(function(){ play("allDone"); celebrate(); }, 170); }
    else if(dayComplete(it.kid, view) && !wasKid){ setTimeout(function(){ play("kidDone"); }, 170); }
    setTimeout(render, 330);
  }

    html += daybarHTML(cueHTML(k.id, false) + progressHTML(k.id));

  /* ---------- schedule screen ---------- */

  function addSchedItem(ki){
    var f = byId("sname-" + ki), name = f.value.trim();

    if(!schedDraft[ki]) schedDraft[ki] = { days:[1,2,3,4,5] };

    if(!days.length) days = [1,2,3,4,5];

    state.items[id] = { id:id, kid:state.kids[ki].id, name:name, type:type, days: type==="daily"?[]:days, t:now() };

  /* ---------- events ---------- */
  function wire(){
    q("[data-view]").forEach(function(b){
      on(b,"click",function(){ viewMode = b.dataset.view; formOpen = false; edit = false; render(); });
    });
    q("[data-sday]").forEach(function(b){
      on(b,"click",function(){ var p = b.dataset.sday.split(":"); toggleItemDay(p[0], +p[1]); render(); });
    });
    q("[data-sdraft]").forEach(function(b){
      on(b,"click",function(){
        var p = b.dataset.sdraft.split(":"), ki = +p[0], d = +p[1];
        if(!schedDraft[ki]) schedDraft[ki] = { days:[1,2,3,4,5] };
        var arr = schedDraft[ki].days, i = arr.indexOf(d);
        if(i === -1) arr.push(d); else arr.splice(i,1);
        var el = byId("sname-"+ki), t = el ? el.value : ""; render();
        var el2 = byId("sname-"+ki); if(el2) el2.value = t;
      });
    });
    q("[data-schedadd]").forEach(function(b){ on(b,"click",function(){ addSchedItem(+b.dataset.schedadd); }); });
    q('[id^="sname-"]').forEach(function(inp){ on(inp,"keydown",function(e){ if(e.key === "Enter") addSchedItem(+inp.id.split("-")[1]); }); });

    q("[data-kid]").forEach(function(b){
      on(b,"click",function(e){ if(e.target.matches("[data-rename]")) return; kid = +b.dataset.kid; formOpen = false; render(); });
    });
    q("[data-rename]").forEach(function(inp){
      on(inp,"change",function(){
        var i = +inp.dataset.rename, v = inp.value.trim();
        state.kids[i] = { id:state.kids[i].id, name:v || NAMES[i] || ("Kid "+(i+1)), t:now() };
        touched(); render();
      });
    });
    on(byId("editBtn"),"click",function(){ edit = !edit; render(); });
    on(byId("prev"),"click",function(){ view = shift(view,-1); render(); });
    on(byId("next"),"click",function(){ view = shift(view,1); render(); });
    on(byId("switchCode"),"click",function(){
      clearInterval(timer); code = null; state = null;
      local(CODEKEY,""); local(CACHE,""); codeScreen();
    });
    on(byId("soundBtn"),"click",function(){
      soundOn = !soundOn; local("packed:sound", soundOn ? "on" : "off");
      if(soundOn) play("got");
      render();
    });

    q(".row").forEach(function(row){
      on(row,"click",function(e){ if(!e.target.matches("[data-del]")) tap(row); });
      on(row,"keydown",function(e){ if(e.key === " " || e.key === "Enter"){ e.preventDefault(); tap(row); } });
    });
    q("[data-del]").forEach(function(b){
      on(b,"click",function(e){
        e.stopPropagation();
        var it = state.items[b.dataset.del];
        if(it){ state.items[it.id] = { id:it.id, kid:it.kid, name:it.name, type:it.type, days:it.days, date:it.date, del:true, t:now() }; }
        touched(); render();
      });
    });

    q("[data-addkid]").forEach(function(b){
      on(b,"click",function(){
        var ki = +b.dataset.addkid;
        if(formOpen && formKid === ki){ formOpen = false; }
        else { formOpen = true; formKid = ki; if(draft.type === "weekly" && !draft.days.length) draft.days = [view.getDay()]; }
        render();
        if(formOpen){ var f = byId("fname"); if(f) f.focus(); }
      });
    });
    q("[data-type]").forEach(function(b){
      on(b,"click",function(){
        draft.type = b.dataset.type;
        if(draft.type === "weekly" && !draft.days.length) draft.days = [view.getDay()];
        var t = byId("fname").value; render(); byId("fname").value = t;
      });
    });
    q("[data-day]").forEach(function(b){
      on(b,"click",function(){
        var d = +b.dataset.day, i = draft.days.indexOf(d);
        if(i === -1) draft.days.push(d); else draft.days.splice(i,1);
        var t = byId("fname").value; render(); byId("fname").value = t;
      });
    });
    on(app.querySelector("[data-cancel]"),"click",function(){ formOpen = false; render(); });
    on(byId("saveItem"),"click",addItem);
    on(byId("fname"),"keydown",function(e){ if(e.key === "Enter") addItem(); });
    q("[data-clearday]").forEach(function(b){
      on(b,"click",function(){
        var ki = +b.dataset.clearday, dk = key(view);
        forDay(state.kids[ki].id, view).forEach(function(it){ setStat(dk, it.id, 0); });
        render();
      });
    });
  }

  function addItem(){
    var f = byId("fname"), name = f.value.trim();
    if(!name){ f.focus(); f.style.borderColor = "var(--red)"; return; }
    if(draft.type === "weekly" && !draft.days.length) draft.days = [view.getDay()];
    var id = uid();
    var it = { id:id, kid:state.kids[formKid].id, name:name, type:draft.type, days:draft.days.slice(), t:now() };
    if(draft.type === "once") it.date = key(view);
    state.items[id] = it;
    draft = { type:draft.type, days:draft.type === "weekly" ? draft.days.slice() : [] };
    formOpen = false;
    touched(); render();
  }

  /* ---------- boot ---------- */
  async function boot(){
    var cached = local(CACHE);
    try{ state = cached ? JSON.parse(cached) : null; }catch(e){ state = null; }
    if(!state || !state.kids || !state.items) state = null;

    if(!state){
      var remote = null;
      try{ remote = await pull(); netOk = true; }catch(e){ netOk = false; }
      state = (remote && remote.kids) ? remote : seed();
      if(!remote) dirty = true;
    }
    tidy();
    render();
    sync();
    clearInterval(timer);
    timer = setInterval(function(){ if(!document.hidden) sync(); }, 5000);
    document.addEventListener("visibilitychange", function(){ if(!document.hidden) sync(); });
    window.addEventListener("focus", function(){ sync(); });
  }

  view = isEvening() ? shift(startOfToday(),1) : startOfToday();
  if(!configured()){ setupScreen(); }
  else {
    code = local(CODEKEY) || null;
    if(!code) codeScreen(); else boot();
  }
})();
</script>
</body>
</html>
